name: Refresh stats

# Deliberately no `push` trigger: this workflow commits generated SVGs,
# and a push trigger would cause it to run again on its own commit.
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC / 10:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate and commit stats
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Generate stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 scripts/generate_stats.py

      - name: Commit generated graphics
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "stats.svg"
            "streak.svg"
            "langs.svg"
            "year.svg"
          )

          # Add matching hd-*.svg files without failing if none exist.
          shopt -s nullglob
          files+=(hd-*.svg)

          # Nothing changed — don't create an empty commit.
          if git diff --quiet -- "${files[@]}"; then
            echo "No stats changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${files[@]}"

          git commit -m "stats: refresh profile graphics"
          git push
